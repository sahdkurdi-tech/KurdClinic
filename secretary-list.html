<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیستی نەخۆشەکان</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .list-container { max-width: 1000px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-weight: bold; }
        .btn-clear-all { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
        .btn-clear-all:hover { background: #dc2626; box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body style="background: #f1f5f9;">

    <div class="list-container">
        <div class="header-flex">
            <h2 style="color: #0f172a; margin: 0;"><i class="fa-solid fa-list-check" style="color: #3b82f6;"></i> لیستی نەخۆشەکانی ئەمڕۆ</h2>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>ژمارە / ناو</th>
                    <th>بەش</th>
                    <th>جۆری سەردان</th>
                    <th>دۆخ</th>
                </tr>
            </thead>
            <tbody id="patientsTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #64748b; font-weight: bold;">چاوەڕێبە، زانیارییەکان باردەکرێن...</td>
                </tr>
            </tbody>
        </table>
    </div>

   <!-- مۆدێلی دەستکاریکردنی (ئیدێت) زانیاری نەخۆش -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; width: 95%; max-width: 500px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: scale(0.9); transition: 0.3s; animation: popIn 0.3s forwards; max-height: 90vh; display: flex; flex-direction: column;">
            
            <h3 style="margin-top: 0; color: #0f172a; margin-bottom: 20px; font-size: 18px; flex-shrink: 0;"><i class="fa-solid fa-pen-to-square" style="color: #3b82f6;"></i> دەستکاریکردنی زانیاری نەخۆش</h3>
            
            <!-- شوێنی هەر چوار خشتەکە -->
            <div id="editGridsWrapper" style="overflow-y: auto; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; margin-bottom: 20px; flex-grow: 1;">
                
                <h4 style="color: #0369a1; margin: 0 0 10px 0; border-bottom: 2px solid #bae6fd; padding-bottom: 5px;"><i class="fa-solid fa-person"></i> پیاوان - سەردان</h4>
                <div id="gridMenConsultEdit" class="edit-grid" style="margin-bottom: 25px;"></div>

                <h4 style="color: #082f49; margin: 0 0 10px 0; border-bottom: 2px solid #0369a1; padding-bottom: 5px;"><i class="fa-solid fa-person"></i> پیاوان - نەشتەرگەری</h4>
                <div id="gridMenSurgeryEdit" class="edit-grid" style="margin-bottom: 25px;"></div>

                <h4 style="color: #be185d; margin: 0 0 10px 0; border-bottom: 2px solid #fbcfe8; padding-bottom: 5px;"><i class="fa-solid fa-person-dress"></i> ئافرەتان - سەردان</h4>
                <div id="gridWomenConsultEdit" class="edit-grid" style="margin-bottom: 25px;"></div>

                <h4 style="color: #831843; margin: 0 0 10px 0; border-bottom: 2px solid #be185d; padding-bottom: 5px;"><i class="fa-solid fa-person-dress"></i> ئافرەتان - نەشتەرگەری</h4>
                <div id="gridWomenSurgeryEdit" class="edit-grid"></div>

            </div>
            
            <div style="flex-shrink: 0;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #475569;">ناوی نەخۆش:</label>
                <input type="text" id="editNameInput" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 16px; outline: none; box-sizing: border-box;">
                
                <div style="display: flex; gap: 10px;">
                    <button id="btnSaveEdit" style="flex: 1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);">سەیڤکردن</button>
                    <button id="btnCancelEdit" style="flex: 1; background: #f1f5f9; color: #475569; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;">داخستن</button>
                </div>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes popIn { to { transform: scale(1); } }
        #editNameInput:focus { border-color: #3b82f6; }
        .edit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; direction: ltr; }
        #editGridsWrapper::-webkit-scrollbar { width: 8px; }
        #editGridsWrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>

    <!-- بەستنەوەی بە فایلی جاڤاسکریپت -->
    <script type="module" src="js/secretary-list.js"></script>
</body>
</html>
